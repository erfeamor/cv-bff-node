name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Master pushes share one group so the deploy path (build -> merge -> deploy)
# of two runs never overlaps: a later run queues until the earlier finishes,
# never killing one mid-roll. Every other run gets a unique group (no queuing).
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'cv-bff-node-deploy' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cv-bff-node:${{ github.sha }} .

      # This job only proves the image builds (single-arch, not pushed) on
      # every push and PR. Publishing and rolling the container is the
      # `build` -> `merge` -> `deploy` jobs below, master pushes only.

  # Deploy path, master pushes only (PRs and other branches never reach AWS):
  #   build (native per-arch matrix, push by digest)
  #   -> merge (one multi-arch manifest: :latest + :<sha>)
  #   -> deploy (SSM roll + smoke).
  # Native arm64 runners replace QEMU emulation, which stalled for 70 min.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, docker]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      id-token: write # GitHub OIDC -> AWS_DEPLOY_ROLE_ARN (trusted for this repo's master only)
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      AWS_REGION: eu-west-3
      ECR_REPOSITORY_URI: 760904708057.dkr.ecr.eu-west-3.amazonaws.com/cv-project-bff-node
    steps:
      - uses: actions/checkout@v4

      - name: Require the deploy role variable
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::Repository variable AWS_DEPLOY_ROLE_ARN is not set (the OIDC deploy role from cv-infra)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cv-bff-node-build-${{ github.run_id }}-${{ matrix.arch }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # No provenance attestation: keeps each digest a plain image
          # manifest, so the merged index holds exactly the two platforms.
          provenance: false
          outputs: type=image,name=${{ env.ECR_REPOSITORY_URI }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-3
      ECR_REPOSITORY_URI: 760904708057.dkr.ecr.eu-west-3.amazonaws.com/cv-project-bff-node
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cv-bff-node-merge-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Create the multi-arch manifest (:latest + :<sha>)
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          ls -1
          # shellcheck disable=SC2046,SC2059 # split digest list; URI has no % in it
          docker buildx imagetools create \
            -t "$ECR_REPOSITORY_URI:latest" \
            -t "$ECR_REPOSITORY_URI:$GITHUB_SHA" \
            $(printf "$ECR_REPOSITORY_URI@sha256:%s " *)

      - name: Assert both platforms are in the manifest
        run: |
          set -euo pipefail
          raw=$(docker buildx imagetools inspect --raw "$ECR_REPOSITORY_URI:latest")
          echo "$raw" | jq .
          for platform in linux/amd64 linux/arm64; do
            if ! jq -e --arg p "$platform" \
              '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | index($p)' \
              <<<"$raw" >/dev/null; then
              echo "::error::$ECR_REPOSITORY_URI:latest is missing $platform."
              exit 1
            fi
          done
          echo "Manifest carries linux/amd64 and linux/arm64."

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-3
      SSM_DOCUMENT_NAME: cv-redeploy-bff-node
      APP_INSTANCE_NAME_TAG: cv-project-domain-service
      SMOKE_URL: https://dvdlxl0zqepqi.cloudfront.net/bff/api/v1/people/1/cv
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cv-bff-node-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll the container (SSM Run Command)
        run: |
          set -euo pipefail
          # Target by tag, not instance id: the app host is replaced often.
          command_id=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT_NAME" \
            --targets "Key=tag:Name,Values=$APP_INSTANCE_NAME_TAG" \
            --comment "cv-bff-node ${GITHUB_SHA::7}" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          # Poll up to 5 minutes. Invocations appear only once SSM has
          # resolved the tag, so an empty list counts as "pending".
          count=0
          status=Pending
          instance_id=
          for _ in $(seq 1 60); do
            sleep 5
            invocations=$(aws ssm list-command-invocations \
              --command-id "$command_id" --details --output json)
            count=$(jq '.CommandInvocations | length' <<<"$invocations")
            if [ "$count" -gt 1 ]; then
              break
            fi
            if [ "$count" -eq 1 ]; then
              status=$(jq -r '.CommandInvocations[0].Status' <<<"$invocations")
              instance_id=$(jq -r '.CommandInvocations[0].InstanceId' <<<"$invocations")
              case "$status" in
                Pending|InProgress|Delayed|Cancelling) continue ;;
                *) break ;;
              esac
            fi
          done

          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one invocation of $command_id on tag Name=$APP_INSTANCE_NAME_TAG, found $count."
            exit 1
          fi

          # --details carries the plugin output (SSM truncates it to the
          # first 2500 chars; cv-redeploy's output is a few lines).
          echo "Invocation status on $instance_id: $status"
          echo "--- last lines of output ---"
          jq -r '.CommandInvocations[0].CommandPlugins[]?.Output // empty' <<<"$invocations" | tail -n 20
          if [ "$status" != "Success" ]; then
            echo "::error::SSM invocation $command_id ended with status '$status' (expected Success)."
            exit 1
          fi

      - name: Smoke test the public aggregate
        run: |
          for attempt in $(seq 1 6); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SMOKE_URL" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test failed: $SMOKE_URL did not return 200."
          exit 1
